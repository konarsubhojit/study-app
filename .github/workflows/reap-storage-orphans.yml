name: Reap abandoned storage uploads

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reap:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Abort expired multipart uploads
        env:
          STORAGE_REAPER_URL: ${{ secrets.STORAGE_REAPER_URL }}
          STORAGE_REAPER_TOKEN: ${{ secrets.STORAGE_REAPER_TOKEN }}
        run: |
          test -n "$STORAGE_REAPER_URL"
          test -n "$STORAGE_REAPER_TOKEN"
          curl --fail-with-body --silent --show-error \
            --retry 3 --retry-all-errors \
            --request POST \
            --header "x-reaper-token: $STORAGE_REAPER_TOKEN" \
            "$STORAGE_REAPER_URL/reapOrphans"
