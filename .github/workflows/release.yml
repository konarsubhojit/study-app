name: Release bundle

# Builds the signed Android App Bundle that is uploaded to the Play Console internal testing
# track (issue #71). Manual only: a release is a decision, not a consequence of merging.
#
# Required repository secrets (see docs/release/play-console.md):
#   UPLOAD_KEYSTORE_BASE64   base64 of the upload keystore (`base64 -w0 upload-keystore.jks`)
#   UPLOAD_KEYSTORE_PASSWORD keystore password
#   UPLOAD_KEY_ALIAS         key alias inside the keystore
#   UPLOAD_KEY_PASSWORD      key password
on:
  workflow_dispatch:
    inputs:
      version-name:
        description: 'Version name shown to users, for example 0.1.0'
        required: true
        type: string
      version-code:
        description: 'Version code; must be higher than every code already uploaded to Play'
        required: true
        type: string

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  bundle:
    name: Build signed bundle
    # GitHub-hosted only: the signing secrets are decoded on the runner, so the job must not
    # execute on a machine whose disk outlives the run.
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: play-internal
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          # Keep in step with `javaToolchain` in gradle/libs.versions.toml.
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: true

      - name: Restore upload keystore
        env:
          UPLOAD_KEYSTORE_BASE64: ${{ secrets.UPLOAD_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [ -z "${UPLOAD_KEYSTORE_BASE64}" ]; then
            echo "::error::UPLOAD_KEYSTORE_BASE64 is not set; see docs/release/play-console.md."
            exit 1
          fi
          # Outside the workspace so no build step, artifact upload or cache can pick it up.
          keystore_dir="${RUNNER_TEMP}/signing"
          mkdir -p "${keystore_dir}"
          chmod 700 "${keystore_dir}"
          printenv UPLOAD_KEYSTORE_BASE64 | base64 --decode > "${keystore_dir}/upload-keystore.jks"
          chmod 600 "${keystore_dir}/upload-keystore.jks"
          echo "STUDYFLOW_UPLOAD_STORE_FILE=${keystore_dir}/upload-keystore.jks" >> "$GITHUB_ENV"

      - name: Build release bundle
        env:
          VERSION_NAME: ${{ inputs.version-name }}
          VERSION_CODE: ${{ inputs.version-code }}
          STUDYFLOW_UPLOAD_STORE_PASSWORD: ${{ secrets.UPLOAD_KEYSTORE_PASSWORD }}
          STUDYFLOW_UPLOAD_KEY_ALIAS: ${{ secrets.UPLOAD_KEY_ALIAS }}
          STUDYFLOW_UPLOAD_KEY_PASSWORD: ${{ secrets.UPLOAD_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          # The inputs reach a shell command line, so they are validated rather than trusted.
          [[ "${VERSION_NAME}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
            echo "::error::version-name must look like 1.2.3."
            exit 1
          }
          [[ "${VERSION_CODE}" =~ ^[0-9]+$ ]] || {
            echo "::error::version-code must be a positive integer."
            exit 1
          }
          ./gradlew :app:bundleRelease \
            -Pstudyflow.requireReleaseSigning=true \
            -Pstudyflow.versionName="${VERSION_NAME}" \
            -Pstudyflow.versionCode="${VERSION_CODE}" \
            --build-cache --configuration-cache --stacktrace

      - name: Remove upload keystore
        if: ${{ always() }}
        run: rm -rf "${RUNNER_TEMP}/signing"

      - name: Upload bundle artifact
        uses: actions/upload-artifact@v7
        with:
          name: studyflow-${{ inputs.version-name }}-${{ inputs.version-code }}-aab
          path: |
            app/build/outputs/bundle/release/*.aab
            app/build/outputs/mapping/release/mapping.txt
          retention-days: 30
          if-no-files-found: error
