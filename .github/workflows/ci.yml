name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    # Advisory only: the action hard-fails when the repository's dependency graph is not
    # available, which is a repository setting no workflow change can turn on. Findings are
    # still reported in the job log, but a missing graph must not block every pull request.
    continue-on-error: true
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v7

      - name: Review dependency changes
        uses: actions/dependency-review-action@v5
        with:
          fail-on-severity: moderate

  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Scan for committed secrets
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build:
    name: Build and verify
    # Pull requests stay on GitHub-hosted runners: this repository is public, so a
    # fork PR must never execute on the self-hosted machine. Default-branch pushes run
    # on the dedicated runner, which has a warm Gradle cache.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      checks: write
      pull-requests: write
      security-events: write
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          # Keep in step with `javaToolchain` in gradle/libs.versions.toml.
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          # Only the default branch may seed the shared cache, so a PR cannot poison it.
          cache-read-only: ${{ github.ref != format('refs/heads/{0}', github.event.repository.default_branch) }}

      - name: Build, test, and check
        id: gradle-build
        shell: bash
        run: |
          start_epoch=$(date +%s)
          ./gradlew build --build-cache --configuration-cache --stacktrace
          end_epoch=$(date +%s)
          echo "duration_seconds=$((end_epoch - start_epoch))" >> "$GITHUB_OUTPUT"

      - name: Record CI timing
        if: ${{ success() }}
        run: |
          {
            echo "### CI timing"
            echo ""
            echo "Gradle build/test/check duration: ${{ steps.gradle-build.outputs.duration_seconds }} seconds"
            echo "Gradle dependency and build cache details are listed in the Set up Gradle job summary."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Publish unit test annotations
        if: ${{ !cancelled() }}
        uses: dorny/test-reporter@v3
        with:
          name: JVM unit tests
          path: '**/build/test-results/test*/TEST-*.xml'
          reporter: java-junit
          fail-on-empty: false
          fail-on-error: false

      # Coverage is a signal, not a target (CONTRIBUTING.md), so the gate looks only at the files
      # this pull request changed. A fork's token cannot write a comment, so there the same run is
      # advisory rather than blocking.
      - name: Report coverage of changed files
        if: ${{ !cancelled() && github.event_name == 'pull_request' }}
        continue-on-error: ${{ github.event.pull_request.head.repo.fork }}
        uses: madrapps/jacoco-report@v1.8.0
        with:
          # JVM modules report under `jacoco/`, Android modules under AGP's `coverage/`.
          paths: |
            ${{ github.workspace }}/**/build/reports/jacoco/**/*.xml
            ${{ github.workspace }}/**/build/reports/coverage/**/*.xml
          token: ${{ secrets.GITHUB_TOKEN }}
          title: Coverage of changed files
          min-coverage-changed-files: 70
          update-comment: true
          pass-emoji: ':green_circle:'
          fail-emoji: ':red_circle:'

      - name: Collect SARIF reports
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          mkdir -p build/ci-sarif
          if ! command -v jq >/dev/null 2>&1; then
            echo "::warning::jq is not available, so SARIF reports cannot be collected."
            exit 0
          fi
          find . \( -path '*/build/reports/*.sarif' -o -path '*/build/reports/*/*.sarif' \) -print0 | while IFS= read -r -d '' report; do
            safe_name=${report#./}
            safe_name=${safe_name//\//-}
            # Every module emits a detekt and a lint run under the same tool name, and code
            # scanning rejects several runs that share a category. Deriving the automation id
            # from the report path gives each run its own category.
            jq --arg prefix "${safe_name%.sarif}" '
              .runs = [
                .runs
                | to_entries[]
                | .value + {
                    automationDetails: ((.value.automationDetails // {}) + {id: "\($prefix)/\(.key)/"})
                  }
              ]
            ' "$report" > "build/ci-sarif/$safe_name"
          done


      - name: Upload reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: reports
          path: |
            **/build/reports/
            **/build/test-results/
          retention-days: 7
          if-no-files-found: ignore

  testing-release-apk:
    name: Build signed testing release APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Check signing availability
        id: signing
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.STUDYFLOW_RELEASE_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.STUDYFLOW_RELEASE_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.STUDYFLOW_RELEASE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.STUDYFLOW_RELEASE_KEY_PASSWORD }}
          IS_FORK_PR: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork || false }}
        run: |
          if [[ "$IS_FORK_PR" == "true" ]]; then
            echo "::notice::Skipping testing APK because signing secrets are unavailable to fork pull requests."
            echo "available=false" >> "$GITHUB_OUTPUT"
          elif [[ -z "$KEYSTORE_BASE64" || -z "$STORE_PASSWORD" || -z "$KEY_ALIAS" || -z "$KEY_PASSWORD" ]]; then
            echo "::notice::Skipping testing APK because one or more release signing secrets are not configured."
            echo "available=false" >> "$GITHUB_OUTPUT"
          else
            echo "available=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v7
        if: steps.signing.outputs.available == 'true'

      - name: Set up JDK
        if: steps.signing.outputs.available == 'true'
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        if: steps.signing.outputs.available == 'true'
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: true

      - name: Configure release signing
        if: steps.signing.outputs.available == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.STUDYFLOW_RELEASE_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.STUDYFLOW_RELEASE_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.STUDYFLOW_RELEASE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.STUDYFLOW_RELEASE_KEY_PASSWORD }}
        shell: bash
        run: |
          : "${KEYSTORE_BASE64:?STUDYFLOW_RELEASE_KEYSTORE_BASE64 is required}"
          : "${STORE_PASSWORD:?STUDYFLOW_RELEASE_STORE_PASSWORD is required}"
          : "${KEY_ALIAS:?STUDYFLOW_RELEASE_KEY_ALIAS is required}"
          : "${KEY_PASSWORD:?STUDYFLOW_RELEASE_KEY_PASSWORD is required}"
          umask 077
          keystore="$RUNNER_TEMP/studyflow-release.jks"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$keystore"
          echo "STUDYFLOW_RELEASE_STORE_FILE=$keystore" >> "$GITHUB_ENV"
          echo "STUDYFLOW_RELEASE_STORE_PASSWORD=$STORE_PASSWORD" >> "$GITHUB_ENV"
          echo "STUDYFLOW_RELEASE_KEY_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"
          echo "STUDYFLOW_RELEASE_KEY_PASSWORD=$KEY_PASSWORD" >> "$GITHUB_ENV"

      - name: Build production release APK
        if: steps.signing.outputs.available == 'true'
        run: ./gradlew :app:assembleProductionRelease --build-cache --configuration-cache --stacktrace

      - name: Verify APK signature
        if: steps.signing.outputs.available == 'true'
        shell: bash
        run: |
          apk="app/build/outputs/apk/production/release/app-production-release.apk"
          unsigned_apk="$(find app/build/outputs/apk/production/release -maxdepth 1 -name '*-unsigned.apk' -print -quit)"
          if [[ -n "$unsigned_apk" ]]; then
            echo "::error::An unsigned production release APK was produced."
            exit 1
          fi
          if [[ ! -s "$apk" ]]; then
            echo "::error::The production release APK is missing."
            exit 1
          fi
          apksigner="$ANDROID_HOME/build-tools/$(ls -1 "$ANDROID_HOME/build-tools" | sort -V | tail -1)/apksigner"
          verification="$("$apksigner" verify --verbose --print-certs "$apk")"
          printf '%s\n' "$verification"
          sha1="$(awk '/certificate SHA-1 digest: / { sub(/^.*certificate SHA-1 digest: /, ""); print; exit }' <<< "$verification")"
          sha256="$(awk '/certificate SHA-256 digest: / { sub(/^.*certificate SHA-256 digest: /, ""); print; exit }' <<< "$verification")"
          if [[ -z "$sha1" || -z "$sha256" ]]; then
            echo "::error::Could not extract the APK signing certificate fingerprints."
            exit 1
          fi
          {
            echo "### Testing release APK signing certificate"
            echo ""
            echo "- SHA-1: \`$sha1\`"
            echo "- SHA-256: \`$sha256\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload testing release APK
        if: steps.signing.outputs.available == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: studyflow-testing-release-apk-${{ github.run_number }}
          path: app/build/outputs/apk/production/release/app-production-release.apk
          if-no-files-found: error
          retention-days: ${{ github.event_name == 'pull_request' && 7 || 14 }}

      - name: Remove release keystore
        if: always()
        shell: bash
        run: |
          keystore="$RUNNER_TEMP/studyflow-release.jks"
          if [[ -f "$keystore" ]]; then
            shred -u -- "$keystore"
          fi
