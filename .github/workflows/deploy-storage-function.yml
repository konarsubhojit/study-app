name: Deploy Edge Function

on:
  workflow_dispatch:
    inputs:
      function_name:
        description: Edge Function to deploy
        required: true
        default: storage
        type: choice
        options:
          - storage
          - api
          - all
      project_ref:
        description: Override SUPABASE_PROJECT_REF repository variable
        required: false
        type: string

concurrency:
  group: supabase-deploy-${{ inputs.project_ref || vars.SUPABASE_PROJECT_REF }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy production Edge Function
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v3
        with:
          version: 2.118.0

      - name: Deploy Edge Function
        env:
          PROJECT_REF: ${{ inputs.project_ref || vars.SUPABASE_PROJECT_REF }}
          FUNCTION_NAME: ${{ inputs.function_name }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          STORAGE_S3_ENDPOINT: ${{ secrets.STORAGE_S3_ENDPOINT }}
          STORAGE_S3_BUCKET: ${{ secrets.STORAGE_S3_BUCKET }}
          STORAGE_S3_ACCESS_KEY_ID: ${{ secrets.STORAGE_S3_ACCESS_KEY_ID }}
          STORAGE_S3_SECRET_ACCESS_KEY: ${{ secrets.STORAGE_S3_SECRET_ACCESS_KEY }}
          ORPHAN_REAPER_TOKEN: ${{ secrets.ORPHAN_REAPER_TOKEN }}
          STORAGE_S3_REGION: ${{ secrets.STORAGE_S3_REGION }}
          STORAGE_SCAN_HOOK_URL: ${{ secrets.STORAGE_SCAN_HOOK_URL }}
          STORAGE_SCAN_HOOK_TOKEN: ${{ secrets.STORAGE_SCAN_HOOK_TOKEN }}
          GOOGLE_SERVER_CLIENT_ID: ${{ secrets.GOOGLE_SERVER_CLIENT_ID }}
          API_MINIMUM_CLIENT_VERSION: ${{ secrets.API_MINIMUM_CLIENT_VERSION }}
          API_BACKUP_RETENTION_DAYS: ${{ secrets.API_BACKUP_RETENTION_DAYS }}
          PASSKEY_RP_ID: ${{ secrets.PASSKEY_RP_ID }}
          PASSKEY_ANDROID_ORIGIN: ${{ secrets.PASSKEY_ANDROID_ORIGIN }}
        run: |
          : "${PROJECT_REF:?Set SUPABASE_PROJECT_REF repository variable or supply project_ref}"
          : "${SUPABASE_ACCESS_TOKEN:?SUPABASE_ACCESS_TOKEN secret is required to deploy $FUNCTION_NAME}"
          : "${SUPABASE_DB_PASSWORD:?SUPABASE_DB_PASSWORD secret is required to push migrations before $FUNCTION_NAME}"
          case "$FUNCTION_NAME" in
            storage)
              : "${STORAGE_S3_ENDPOINT:?STORAGE_S3_ENDPOINT secret is required to deploy $FUNCTION_NAME}"
              : "${STORAGE_S3_BUCKET:?STORAGE_S3_BUCKET secret is required to deploy $FUNCTION_NAME}"
              : "${STORAGE_S3_ACCESS_KEY_ID:?STORAGE_S3_ACCESS_KEY_ID secret is required to deploy $FUNCTION_NAME}"
              : "${STORAGE_S3_SECRET_ACCESS_KEY:?STORAGE_S3_SECRET_ACCESS_KEY secret is required to deploy $FUNCTION_NAME}"
              : "${ORPHAN_REAPER_TOKEN:?ORPHAN_REAPER_TOKEN secret is required to deploy $FUNCTION_NAME}"
              ;;
            api)
              : "${STORAGE_S3_ENDPOINT:?STORAGE_S3_ENDPOINT secret is required to deploy $FUNCTION_NAME}"
              : "${STORAGE_S3_BUCKET:?STORAGE_S3_BUCKET secret is required to deploy $FUNCTION_NAME}"
              : "${STORAGE_S3_ACCESS_KEY_ID:?STORAGE_S3_ACCESS_KEY_ID secret is required to deploy $FUNCTION_NAME}"
              : "${STORAGE_S3_SECRET_ACCESS_KEY:?STORAGE_S3_SECRET_ACCESS_KEY secret is required to deploy $FUNCTION_NAME}"
              : "${GOOGLE_SERVER_CLIENT_ID:?GOOGLE_SERVER_CLIENT_ID secret is required to deploy $FUNCTION_NAME}"
              : "${API_MINIMUM_CLIENT_VERSION:?API_MINIMUM_CLIENT_VERSION secret is required to deploy $FUNCTION_NAME}"
              : "${API_BACKUP_RETENTION_DAYS:?API_BACKUP_RETENTION_DAYS secret is required to deploy $FUNCTION_NAME}"
              : "${PASSKEY_RP_ID:?PASSKEY_RP_ID secret is required to deploy $FUNCTION_NAME}"
              : "${PASSKEY_ANDROID_ORIGIN:?PASSKEY_ANDROID_ORIGIN secret is required to deploy $FUNCTION_NAME}"
              ;;
            all)
              : "${STORAGE_S3_ENDPOINT:?STORAGE_S3_ENDPOINT secret is required to deploy $FUNCTION_NAME}"
              : "${STORAGE_S3_BUCKET:?STORAGE_S3_BUCKET secret is required to deploy $FUNCTION_NAME}"
              : "${STORAGE_S3_ACCESS_KEY_ID:?STORAGE_S3_ACCESS_KEY_ID secret is required to deploy $FUNCTION_NAME}"
              : "${STORAGE_S3_SECRET_ACCESS_KEY:?STORAGE_S3_SECRET_ACCESS_KEY secret is required to deploy $FUNCTION_NAME}"
              : "${ORPHAN_REAPER_TOKEN:?ORPHAN_REAPER_TOKEN secret is required to deploy $FUNCTION_NAME}"
              : "${GOOGLE_SERVER_CLIENT_ID:?GOOGLE_SERVER_CLIENT_ID secret is required to deploy $FUNCTION_NAME}"
              : "${API_MINIMUM_CLIENT_VERSION:?API_MINIMUM_CLIENT_VERSION secret is required to deploy $FUNCTION_NAME}"
              : "${API_BACKUP_RETENTION_DAYS:?API_BACKUP_RETENTION_DAYS secret is required to deploy $FUNCTION_NAME}"
              : "${PASSKEY_RP_ID:?PASSKEY_RP_ID secret is required to deploy $FUNCTION_NAME}"
              : "${PASSKEY_ANDROID_ORIGIN:?PASSKEY_ANDROID_ORIGIN secret is required to deploy $FUNCTION_NAME}"
              ;;
            *)
              echo "Unsupported function: $FUNCTION_NAME" >&2
              exit 2
              ;;
          esac
          infra/scripts/deploy-storage-function.sh "$PROJECT_REF" "$FUNCTION_NAME"
