name: Deploy backend

on:
  workflow_dispatch:
    inputs:
      project_ref:
        description: Override SUPABASE_PROJECT_REF repository variable
        required: false
        type: string

concurrency:
  group: supabase-deploy-${{ inputs.project_ref || vars.SUPABASE_PROJECT_REF }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy production migrations
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v3
        with:
          version: 2.118.0

      - name: Deploy migrations
        env:
          PROJECT_REF: ${{ inputs.project_ref || vars.SUPABASE_PROJECT_REF }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          : "${PROJECT_REF:?Set SUPABASE_PROJECT_REF repository variable or supply project_ref}"
          test -n "$SUPABASE_ACCESS_TOKEN"
          test -n "$SUPABASE_DB_PASSWORD"
          infra/scripts/deploy-prod.sh "$PROJECT_REF"
