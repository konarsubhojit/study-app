name: Slow verification

on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

concurrency:
  group: slow-verification-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  android-managed-devices:
    name: Gradle Managed Device tests
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' && github.ref != 'refs/heads/master' }}

      # Includes :app:pixel6Api34ProductionReleaseTestAndroidTest, which runs every instrumented
      # test in :app (timer process-death coverage and the minified-release smoke test) against
      # `productionReleaseTest` — the `productionRelease` variant with only `isDebuggable` flipped
      # to `true`, so R8 shrinking (though not obfuscation, which AGP always skips on a debuggable
      # build type) gets an on-device run. See "Minified release smoke test" in CONTRIBUTING.md;
      # a plain `release`/`productionRelease` APK cannot be instrumented at all, since the
      # platform requires a debuggable target to attach a test runner.
      - name: Run configured managed-device tests
        shell: bash
        run: |
          mkdir -p build/ci
          ./gradlew tasks --all --console=plain > build/ci/gradle-tasks.txt
          timer_task=":app:pixel6Api34ProductionReleaseTestAndroidTest"
          timer_task_path="${timer_task#:}"
          timer_task_available=false
          managed_device_tasks=()
          # Matched on the managed device name (`pixel6Api34`, from AndroidCommon.kt) rather than
          # on any particular build type, so a module's `*DebugAndroidTest` and `:app`'s
          # `*ProductionReleaseTestAndroidTest`/`*MockReleaseTestAndroidTest` are all discovered the
          # same way; this deliberately excludes the per-module aggregate tasks (`assembleAndroidTest`,
          # `connectedAndroidTest`, ...), which do not run on a managed device at all.
          mapfile -t additional_managed_device_tasks < <(
            awk '/^[[:space:]]*[^[:space:]]+pixel6Api34[^[:space:]]*AndroidTest[[:space:]]+-/ { print $1 }' build/ci/gradle-tasks.txt
          )

          for task in "${additional_managed_device_tasks[@]}"; do
            if [[ -z "$task" ]]; then
              continue
            fi

            normalized_task="${task#:}"
            if [[ "$normalized_task" == "$timer_task_path" ]]; then
              timer_task_available=true
              continue
            fi

            duplicate=false
            if ((${#managed_device_tasks[@]} > 0)); then
              for existing_task in "${managed_device_tasks[@]}"; do
                if [[ "$existing_task" == "$task" ]]; then
                  duplicate=true
                  break
                fi
              done
            fi

            if [[ "$duplicate" == "false" ]]; then
              managed_device_tasks+=("$task")
            fi
          done

          if [[ "$timer_task_available" == "true" ]]; then
            if ((${#managed_device_tasks[@]} > 0)); then
              ./gradlew "$timer_task" "${managed_device_tasks[@]}" --build-cache --configuration-cache --stacktrace
            else
              ./gradlew "$timer_task" --build-cache --configuration-cache --stacktrace
            fi
          elif ((${#managed_device_tasks[@]} > 0)); then
            ./gradlew "${managed_device_tasks[@]}" --build-cache --configuration-cache --stacktrace
          else
            echo "::notice::No Gradle Managed Device Android test tasks are configured yet."
            exit 0
          fi

      - name: Upload slow verification reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: slow-verification-reports
          path: |
            **/build/reports/
            **/build/test-results/
            **/build/outputs/androidTest-results/
          retention-days: 7
          if-no-files-found: ignore

  timer-soak:
    name: Timer long-run soak
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: true

      - name: Run scheduled timer soak tests
        run: ./gradlew :core:domain:test -Pstudyflow.soak=true --tests dev.studyflow.core.domain.timer.TimerLongRunSoakTest --stacktrace

  quarantined-tests:
    name: Quarantined flaky tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: true

      # Tests annotated `@Flaky` are excluded from `./gradlew test` so a known flake cannot block a
      # pull request. They are still run here, every night, so the flake stays measured instead of
      # forgotten. An empty quarantine is the goal and passes.
      - name: Run the quarantine
        shell: bash
        run: ./gradlew test -Pstudyflow.quarantine=true --continue --stacktrace

      - name: Upload quarantine reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: quarantine-reports
          path: |
            **/build/reports/tests/
            **/build/test-results/
          retention-days: 7
          if-no-files-found: ignore
