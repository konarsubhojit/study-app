name: Slow verification

on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

concurrency:
  group: slow-verification-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  android-managed-devices:
    name: Gradle Managed Device tests
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' && github.ref != 'refs/heads/master' }}

      - name: Run configured managed-device tests
        shell: bash
        run: |
          mkdir -p build/ci
          ./gradlew tasks --all --console=plain > build/ci/gradle-tasks.txt
          mapfile -t managed_device_tasks < <(
            awk '/^[[:space:]]*[[:alnum:]_]+DebugAndroidTest[[:space:]]+-/ { print $1 }' build/ci/gradle-tasks.txt
          )

          if ((${#managed_device_tasks[@]} == 0)); then
            echo "::notice::No Gradle Managed Device Android test tasks are configured yet."
            exit 0
          fi

          ./gradlew "${managed_device_tasks[@]}" --build-cache --configuration-cache --stacktrace

      - name: Upload slow verification reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: slow-verification-reports
          path: |
            **/build/reports/
            **/build/test-results/
            **/build/outputs/androidTest-results/
          retention-days: 7
          if-no-files-found: ignore
