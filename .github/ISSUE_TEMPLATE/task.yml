name: Engineering task
description: Track scoped maintenance or implementation work
title: "[Task] "
labels:
  - infra
body:
  - type: textarea
    id: goal
    attributes:
      label: Goal
      description: State the outcome this task must achieve.
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Scope
      description: List the work included and any explicit non-goals.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      placeholder: |
        - [ ] …
        - [ ] …
    validations:
      required: true
  - type: textarea
    id: dependencies
    attributes:
      label: Dependencies
      description: Link blocking issues, ADRs, or external prerequisites.
