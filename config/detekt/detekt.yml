# StudyFlow detekt rules.
#
# Built on top of the detekt defaults (`buildUponDefaultConfig = true`); only deviations are
# listed here so upstream rule improvements are inherited automatically.
#
# Modules that compile Compose additionally load the Compose ruleset
# (io.nlopez.compose.rules:detekt) with its own defaults; add a `Compose:` section here to deviate
# from those.

build:
  maxIssues: 0

coroutines:
  InjectDispatcher:
    excludes: ['**/core/common/**']
  RedundantSuspendModifier:
    active: false

potential-bugs:
  UnreachableCode:
    active: false

complexity:
  LongParameterList:
    # Domain value types are constructed explicitly rather than through builders.
    functionThreshold: 8
    constructorThreshold: 10
    # A test data builder mirrors a model field for field, and every parameter has a default, so
    # the call site names only what the test is about. That is the opposite of the problem this
    # rule exists to catch, so it is waived for test code only.
    excludes: ['**/src/test/**', '**/src/androidTest/**', '**/core/testing/**']
  TooManyFunctions:
    thresholdInClasses: 15
    thresholdInFiles: 20
    ignorePrivate: true

style:
  ForbiddenMethodCall:
    active: true
    methods:
      - 'java.lang.System.currentTimeMillis'
      - 'kotlin.System.currentTimeMillis'
      - 'kotlin.time.Clock.System.now'
      - 'android.os.SystemClock.currentThreadTimeMillis'
      - 'android.os.SystemClock.elapsedRealtime'
      - 'android.os.SystemClock.elapsedRealtimeNanos'
      - 'android.os.SystemClock.uptimeMillis'
    excludes:
      - '**/core/common/**'
      # The one Android-aware ElapsedRealtimeSource implementation (issue #47) — see its KDoc.
      - '**/core/scheduling/**/AndroidElapsedRealtimeSource.kt'
  ForbiddenImport:
    active: true
    imports:
      - 'android.os.SystemClock'
    excludes:
      - '**/core/common/**'
      - '**/core/scheduling/**/AndroidElapsedRealtimeSource.kt'
  MaxLineLength:
    maxLineLength: 120
  ReturnCount:
    # Guard clauses at the top of a function are clearer than nesting the happy path.
    excludeGuardClauses: true
  MagicNumber:
    ignorePropertyDeclaration: true
    ignoreCompanionObjectPropertyDeclaration: true
    ignoreAnnotation: true
    ignoreNamedArgument: true
  ForbiddenComment:
    # TODOs are tracked as GitHub issues; a bare comment should not fail the build.
    active: false
  UnusedPrivateMember:
    active: true

naming:
  FunctionNaming:
    # JUnit test names read as sentences.
    excludes: ['**/test/**']
    # `@Composable` functions are PascalCase by convention: they read as UI elements, not calls.
    ignoreAnnotated: ['Composable']

exceptions:
  TooGenericExceptionCaught:
    active: true
  SwallowedException:
    active: true
