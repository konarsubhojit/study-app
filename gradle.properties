# D8/R8 run inside the Gradle daemon, and `mergeExtDex*` holds every external library's dex in
# memory at once. With 3g the daemon ran out of heap on CI whenever dex merging overlapped the
# parallel lint analysis tasks, so the ceiling is sized for that peak rather than for compilation
# alone. Kotlin compiles in its own daemon, which would otherwise inherit these arguments and
# reserve the same (now much larger) heap a second time.
org.gradle.jvmargs=-Xmx6g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8
kotlin.daemon.jvmargs=-Xmx2g -XX:MaxMetaspaceSize=512m
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true
org.gradle.configuration-cache.parallel=true

kotlin.code.style=official

# Compose preview screenshot tests (`studyflow.screenshot`); still behind an AGP flag.
android.experimental.enableScreenshotTest=true
