syntax = "proto2";

package dev.studyflow.core.datastore.proto;

option java_multiple_files = true;
option java_package = "dev.studyflow.core.datastore.proto";
option optimize_for = LITE_RUNTIME;

enum Theme {
  THEME_SYSTEM = 0;
  THEME_LIGHT = 1;
  THEME_DARK = 2;
}

enum SyncMode {
  SYNC_MODE_WIFI_ONLY = 0;
  SYNC_MODE_ANY_NETWORK = 1;
  SYNC_MODE_MANUAL = 2;
}

message UserSettings {
  optional Theme theme = 1 [default = THEME_SYSTEM];
  optional uint32 default_focus_minutes = 2 [default = 25];
  optional uint32 default_break_minutes = 3 [default = 5];
  optional bool reminders_enabled = 4 [default = false];
  optional uint32 reminder_hour = 5 [default = 9];
  optional uint32 reminder_minute = 6 [default = 0];
  optional uint64 storage_quota_bytes = 7 [default = 1073741824];
  optional SyncMode sync_mode = 8 [default = SYNC_MODE_WIFI_ONLY];

  reserved 9 to 15;

  // A single "N tasks due today" morning notification instead of one ping per task (issue #47).
  // Field 16 rather than reclaiming 9-15: those numbers are reserved, not merely unused, so a
  // build that still has an old value serialized under one of them must keep failing to parse it
  // as this field rather than silently reinterpreting old bytes.
  optional bool digest_enabled = 16 [default = false];

  // The sound an ALARM_CLOCK-precision reminder plays (issue #48). Empty means "use the device's
  // default alarm sound" rather than a hardcoded URI: the default is chosen by RingtoneManager at
  // playback time, so a user who changes their system default alarm later gets the new one without
  // this app needing to know about it. A non-empty value is whatever content URI the system
  // ringtone picker (`RingtoneManager.ACTION_RINGTONE_PICKER`) returned, persisted verbatim.
  optional string alarm_ringtone_uri = 17 [default = ""];

  // Pomodoro/session-safety defaults used by the timer's scheduled alarms (issue #34).
  optional uint32 maximum_session_minutes = 18 [default = 480];
  optional uint32 inactivity_prompt_minutes = 19 [default = 120];

  // Overall daily/weekly study targets for goal progress rings (issue #73). `0` means "no goal
  // set" rather than a sentinel elsewhere: a freshly installed app has no target and no progress
  // ring to show, without needing a separate "has a goal" flag that could disagree with the value.
  optional uint32 daily_goal_minutes = 20 [default = 0];
  optional uint32 weekly_goal_minutes = 21 [default = 0];

  // Opt-in, rate-limited nudges (issue #73). `nudges_enabled` is the single master switch every
  // nudge type is gated behind — turning it off silences all of them at once, regardless of the
  // per-type toggles below, satisfying "easy to turn off entirely". All default to `false`: a
  // fresh install sends zero nudges until the user opts in, matching "defaults are conservative".
  optional bool nudges_enabled = 22 [default = false];
  optional bool end_of_day_summary_enabled = 23 [default = false];
  optional bool goal_almost_reached_enabled = 24 [default = false];
}
